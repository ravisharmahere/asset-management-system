name: CI/CD Pipeline

on:
  push:
    branches:
      - prod
  workflow_dispatch:

env:
  APP_NAME: asset-management-system

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Build the Docker image from the Dockerfile
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:latest .

      # Log in to Docker Hub using secrets stored in GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      # Push the Docker image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Deploy to your EC2 instance via SSH
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }} # Public DNS or IP of your EC2 instance
          username: ec2-user # Adjust if using a different default user
          key: ${{ secrets.EC2_SSH_KEY }} # Your private key (stored as a GitHub secret)
          script: |
            # Check disk space
            df -h

            # Clean up Docker resources
            docker system prune -f
            docker volume prune -f

            # Remove old images
            docker images -q | xargs -r docker rmi -f

            # Check disk space after cleanup
            df -h

            # Pull the latest Docker image from Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:latest

            # Stop and remove any running container named '${{ env.APP_NAME }}' if exists
            docker stop ${{ env.APP_NAME }} || true
            docker rm ${{ env.APP_NAME }} || true

            # Run the new container with a specific name and ensure proper port mapping
            docker run --name ${{ env.APP_NAME }} --env-file /home/ec2-user/.env -d -p 80:3000 ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:latest
